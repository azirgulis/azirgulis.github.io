<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Europe Demographics Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="./assets/eu-DcNPwWMJ.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/legend-CBFwcxO8.js">
  <link rel="modulepreload" crossorigin href="./assets/zoom-Di2v0NVo.js">
  <link rel="modulepreload" crossorigin href="./assets/sidebar-DQetIQQa.js">
  <link rel="stylesheet" crossorigin href="./assets/legend-CImow6MP.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <div class="header-left">
        <h1>Europe Demographics Explorer</h1>
        <a href="./index.html" class="nav-link">Lithuania</a>
        <a href="./cci.html" class="nav-link">Child Premium</a>
      </div>
      <div class="header-right">
        <div id="nuts-toggle">
          <button class="nuts-btn active" data-level="nuts2">NUTS 2</button>
          <button class="nuts-btn" data-level="nuts3">NUTS 3</button>
        </div>
        <div id="variable-selector"></div>
      </div>
    </header>
    <main id="main">
      <div id="map-container">
        <div id="year-display"></div>
        <svg id="map"></svg>
        <div id="legend"></div>
        <div id="data-source">Source: <a href="https://ec.europa.eu/eurostat" target="_blank" rel="noopener">Eurostat</a></div>
        <div id="tooltip" class="hidden"></div>
      </div>
      <aside id="sidebar" class="collapsed">
        <button id="sidebar-close" aria-label="Close sidebar">&times;</button>
        <div id="sidebar-content">
          <h2 id="sidebar-name"></h2>
          <div id="sidebar-value"></div>
          <div id="sidebar-sparkline"></div>
          <div id="sidebar-comparison"></div>
        </div>
      </aside>
    </main>
    <footer id="controls">
      <div id="playback-controls">
        <button id="play-btn" aria-label="Play">&#9654;</button>
        <div id="speed-control">
          <button class="speed-btn" data-speed="0.5">0.5×</button>
          <button class="speed-btn active" data-speed="1">1×</button>
          <button class="speed-btn" data-speed="2">2×</button>
        </div>
      </div>
      <div id="slider-container">
        <input type="range" id="year-slider" min="2000" max="2024" value="2000" step="1" />
        <div id="slider-labels"></div>
      </div>
    </footer>
    <div id="loading-overlay">
      <div class="spinner"></div>
      <p>Loading data…</p>
    </div>
  </div>
</body>
</html>
